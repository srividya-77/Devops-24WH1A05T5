\<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main parent container linking side-by-side layout -->
    <div class="form-wrapper">
        
        <!-- Left Side: Image Container -->
        <div class="image-container">
            <!-- Uses your cloud placeholder image path -->
            <img src="pic.png" alt="Registration Event Visual">
        </div>

        <!-- Right Side: Form Container -->
        <div class="registration-container">
            <h2>Register</h2>
            
            <form id="registrationForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" required>
                
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" required>
                
                <label for="education">Education:</label>
                <input type="text" id="education" name="education" required>
                
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
                
                <!-- Gender Selection Group -->
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label> 
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                </div>
                
                <label for="skills">Skills:</label>
                <input type="text" id="skills" name="skills" required>  
                
                <label for="experience">Experience:</label>
                <input type="text" id="experience" name="experience" required>
                
                <label for="certifications">Certifications:</label>
                <input type="text" id="certifications" name="certifications" required>
                
                <label for="projects">Projects:</label>
                <input type="text" id="projects" name="projects" required>
                
                <!-- Terms and Conditions Group -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the terms and conditions</label>
                </div>
                
                <table>
                    <tr>
                        <td><label for="linkedin">LinkedIn:</label></td>
                        <td><input type="text" id="linkedin" name="linkedin"></td>
                    </tr>
                    <tr>
                        <td><label for="github">GitHub:</label></td>
                        <td><input type="text" id="github" name="github"></td>
                    </tr>
                </table>
                
                <!-- Technical Profile Stack Lists -->
                <ul>
                    <li>
                        <label for="languages">Programming Languages:</label>
                        <input type="text" id="languages" name="languages">
                    </li>
                    <li>
                        <label for="tools">Tools:</label>
                        <input type="text" id="tools" name="tools">
                    </li>
                </ul>
                
                <label for="availability">Availability:</label>
                <input type="text" id="availability" name="availability" required>
                
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>
                
                <!-- Dynamic Response Status Element for JS Alerts -->
                <div id="statusMessage"></div>
                
                <button type="submit">Register</button>
            </form>
        </div>

    </div>

    <!-- JavaScript Logic Handling Validation & Form Processing -->
    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevents page reload
            
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = ''; 
            statusDiv.textContent = '';

            // 1. FRONTEND VALIDATION
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value;

            // Password Match Validation Rule
            if (password !== confirmPassword) {
                statusDiv.className = 'msg-error';
                statusDiv.textContent = 'Passwords do not match.';
                return;
            }

            // Numeric Phone Validation Rule (10 digits minimum)
            const phoneRegex = /^[0-9]{10,}$/;
            if (!phoneRegex.test(phone.replace(/[\s-]/g, ''))) {
                statusDiv.className = 'msg-error';
                statusDiv.textContent = 'Please enter a valid phone number (at least 10 digits).';
                return;
            }

            // 2. DATA BINDING AUTOMATION
            const formData = new FormData(this);
            const formObject = Object.fromEntries(formData.entries());

            // 3. STORAGE & TRANSMISSION PIPELINE
            try {
                statusDiv.className = 'msg-info';
                statusDiv.textContent = 'Submitting registration...';

                // API Endpoint Destination for your Microservices Backend Server
                const response = await fetch('http://127.0.0', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formObject)
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.className = 'msg-success';
                    statusDiv.textContent = 'Registration successful!';
                    this.reset(); // Safely flushes input fields on successful response
                } else {
                    statusDiv.className = 'msg-error';
                    statusDiv.textContent = result.detail || 'Server error occurred during processing.';
                }
            } catch (error) {
                // local fallback logs if your backend is currently sleeping/offline
                console.warn('Microservice offline. Safe storage capture dump:', formObject);
                
                statusDiv.className = 'msg-error';
                statusDiv.textContent = 'Could not reach backend service. Registration payload printed to Developer Console.';
            }
        });
    </script>
</body>
</html>
